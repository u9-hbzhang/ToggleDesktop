name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore ToggleDesktop.csproj
      
    - name: Build
      run: dotnet build ToggleDesktop.csproj --configuration Release --no-restore -p:SelfContained=false -p:RuntimeIdentifier=

    - name: Generate release notes from tag annotation
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $notes = git for-each-ref "refs/tags/$tag" --format="%(contents)"

        if ([string]::IsNullOrWhiteSpace($notes)) {
          $notes = $tag
        }

        $notes | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: |
          ./bin/Release/net8.0-windows7.0/ToggleDesktop.exe
          ./bin/Release/net8.0-windows7.0/ToggleDesktop.dll
          ./bin/Release/net8.0-windows7.0/ToggleDesktop.runtimeconfig.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Force release body from tag annotation
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "${{ github.ref_name }}"
        $repo = "${{ github.repository }}"
        $notes = Get-Content -Path RELEASE_NOTES.md -Raw

        $headers = @{
          Authorization = "Bearer $env:GITHUB_TOKEN"
          "User-Agent" = "github-actions"
          Accept = "application/vnd.github+json"
        }

        $release = Invoke-RestMethod `
          -Method Get `
          -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" `
          -Headers $headers

        $payload = @{ body = $notes } | ConvertTo-Json -Compress

        Invoke-RestMethod `
          -Method Patch `
          -Uri "https://api.github.com/repos/$repo/releases/$($release.id)" `
          -Headers $headers `
          -Body $payload `
          -ContentType "application/json" | Out-Null

